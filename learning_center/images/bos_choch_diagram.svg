<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#0f1420"/>
  <text x="400" y="35" fill="#e8ecf1" font-size="20" font-weight="bold" text-anchor="middle">Market Structure: BOS vs CHoCH</text>

  <!-- Structure path: uptrend HH/HL then CHoCH down -->
  <polyline points="70,300 140,220 200,250 270,150 330,190 400,100 460,140" fill="none" stroke="#4ecb71" stroke-width="3"/>
  <polyline points="460,140 540,230" fill="none" stroke="#ff6b6b" stroke-width="3"/>
  <polyline points="540,230 610,190 670,290" fill="none" stroke="#ff6b6b" stroke-width="3"/>

  <!-- Labels for swing points -->
  <circle cx="140" cy="220" r="4" fill="#4ecb71"/><text x="140" y="210" fill="#8a93a6" font-size="12" text-anchor="middle">HH</text>
  <circle cx="200" cy="250" r="4" fill="#4ecb71"/><text x="200" y="268" fill="#8a93a6" font-size="12" text-anchor="middle">HL</text>
  <circle cx="270" cy="150" r="4" fill="#4ecb71"/><text x="270" y="138" fill="#8a93a6" font-size="12" text-anchor="middle">HH</text>
  <circle cx="330" cy="190" r="4" fill="#4ecb71"/><text x="330" y="208" fill="#8a93a6" font-size="12" text-anchor="middle">HL</text>
  <circle cx="400" cy="100" r="4" fill="#4ecb71"/><text x="400" y="88" fill="#8a93a6" font-size="12" text-anchor="middle">HH</text>
  <circle cx="460" cy="140" r="4" fill="#ffd166" stroke="#ffd166"/><text x="470" y="128" fill="#ffd166" font-size="12" text-anchor="middle">Last HL</text>

  <line x1="330" y1="190" x2="620" y2="190" stroke="#ffd166" stroke-width="1" stroke-dasharray="5,4"/>

  <circle cx="540" cy="230" r="4" fill="#ff6b6b"/>
  <text x="540" y="255" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">CHoCH</text>
  <text x="540" y="270" fill="#8a93a6" font-size="11" text-anchor="middle">(breaks below last HL)</text>

  <circle cx="670" cy="290" r="4" fill="#ff6b6b"/>
  <text x="670" y="312" fill="#ff6b6b" font-size="13" font-weight="bold" text-anchor="middle">BOS (down)</text>
  <text x="670" y="326" fill="#8a93a6" font-size="11" text-anchor="middle">confirms new downtrend</text>

  <text x="220" y="70" fill="#4ecb71" font-size="14" text-anchor="middle">Uptrend: HH / HL structure</text>

  <text x="400" y="400" fill="#5b6478" font-size="12" text-anchor="middle">Original illustrative diagram — educational purposes only</text>
</svg>
