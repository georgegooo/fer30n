<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#0f1420"/>
  <text x="400" y="35" fill="#e8ecf1" font-size="20" font-weight="bold" text-anchor="middle">Moving Average Crossover (Golden / Death Cross)</text>

  <!-- Price line -->
  <path d="M 60 260 C 150 220, 220 300, 300 260 S 420 150, 500 140 S 620 90, 740 70"
        stroke="#e8ecf1" stroke-width="1.5" fill="none" opacity="0.7"/>
  <text x="700" y="60" fill="#e8ecf1" font-size="11">Price</text>

  <!-- Fast MA -->
  <path d="M 60 250 C 160 240, 230 270, 310 250 S 430 170, 500 155 S 630 100, 740 80"
        stroke="#4ecb71" stroke-width="2.5" fill="none"/>
  <text x="600" y="115" fill="#4ecb71" font-size="12">Fast MA (e.g. 50)</text>

  <!-- Slow MA -->
  <path d="M 60 280 C 180 275, 260 265, 340 245 S 460 210, 540 190 S 660 150, 740 130"
        stroke="#ff6b6b" stroke-width="2.5" fill="none"/>
  <text x="600" y="200" fill="#ff6b6b" font-size="12">Slow MA (e.g. 200)</text>

  <!-- Crossover marker -->
  <circle cx="430" cy="205" r="7" fill="#ffd166"/>
  <text x="445" y="200" fill="#ffd166" font-size="12">Golden Cross → إشارة اتجاه صاعد محتمل</text>
  <line x1="430" y1="215" x2="430" y2="330" stroke="#ffd166" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="400" y="360" fill="#8fa3c8" font-size="11" text-anchor="middle">مؤشر متأخر (lagging) بطبيعته — يتحقق أفضل في أنظمة السوق الاتجاهية (TRENDING) لا العرضية (RANGING)</text>
</svg>
