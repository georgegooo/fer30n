<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#0f1420"/>
  <text x="400" y="35" fill="#e8ecf1" font-size="20" font-weight="bold" text-anchor="middle">Liquidity Sweep (Stop Hunt)</text>

  <!-- Equal lows line -->
  <line x1="80" y1="280" x2="720" y2="280" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="90" y="272" fill="#ffd166" font-size="13">Sell-Side Liquidity (equal lows)</text>

  <!-- Swing lows approaching the level -->
  <g stroke="#8a93a6" stroke-width="2">
    <line x1="140" y1="220" x2="140" y2="278"/>
    <rect x="130" y="240" width="20" height="30" fill="#3a4256"/>
    <line x1="220" y1="215" x2="220" y2="279"/>
    <rect x="210" y="235" width="20" height="35" fill="#3a4256"/>
    <line x1="300" y1="210" x2="300" y2="278"/>
    <rect x="290" y="230" width="20" height="35" fill="#3a4256"/>
  </g>

  <!-- Sweep candle: pokes below the level then closes back above -->
  <line x1="380" y1="200" x2="380" y2="320" stroke="#ff6b6b" stroke-width="2.5"/>
  <rect x="368" y="230" width="24" height="60" fill="#ff6b6b"/>
  <text x="380" y="345" fill="#ff6b6b" font-size="13" text-anchor="middle">Sweep below the level</text>
  <text x="380" y="362" fill="#ff6b6b" font-size="13" text-anchor="middle">(stops triggered)</text>

  <!-- Rejection / reversal candles back up -->
  <g stroke="#4ecb71" stroke-width="2">
    <line x1="450" y1="250" x2="450" y2="190"/>
    <rect x="440" y="195" width="20" height="40" fill="#4ecb71"/>
    <line x1="520" y1="200" x2="520" y2="140"/>
    <rect x="510" y="145" width="20" height="40" fill="#4ecb71"/>
    <line x1="590" y1="150" x2="590" y2="95"/>
    <rect x="580" y="100" width="20" height="35" fill="#4ecb71"/>
    <line x1="660" y1="105" x2="660" y2="70"/>
    <rect x="650" y="72" width="20" height="25" fill="#4ecb71"/>
  </g>

  <path d="M 392 260 L 445 232" stroke="#ffd166" stroke-width="2"/>
  <text x="600" y="60" fill="#8a93a6" font-size="13" text-anchor="middle">Sharp reversal after liquidity is taken</text>

  <text x="400" y="400" fill="#5b6478" font-size="12" text-anchor="middle">Original illustrative diagram — educational purposes only</text>
</svg>
