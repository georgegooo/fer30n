<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#0f1420"/>
  <text x="400" y="35" fill="#e8ecf1" font-size="20" font-weight="bold" text-anchor="middle">Bullish Order Block (SMC)</text>

  <!-- Grid lines -->
  <g stroke="#232a3a" stroke-width="1">
    <line x1="60" y1="80" x2="760" y2="80"/>
    <line x1="60" y1="160" x2="760" y2="160"/>
    <line x1="60" y1="240" x2="760" y2="240"/>
    <line x1="60" y1="320" x2="760" y2="320"/>
  </g>

  <!-- Down candles (consolidation before) -->
  <g stroke="#8a93a6" stroke-width="2">
    <line x1="100" y1="230" x2="100" y2="270"/>
    <rect x="90" y="240" width="20" height="20" fill="#3a4256"/>
    <line x1="150" y1="235" x2="150" y2="275"/>
    <rect x="140" y="245" width="20" height="20" fill="#3a4256"/>
  </g>

  <!-- The Order Block candle (last down candle before the rally) -->
  <line x1="220" y1="225" x2="220" y2="285" stroke="#ff6b6b" stroke-width="2"/>
  <rect x="210" y="235" width="20" height="35" fill="#ff6b6b"/>
  <rect x="205" y="230" width="220" height="65" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="315" y="222" fill="#ffd166" font-size="14" text-anchor="middle">Order Block Zone</text>

  <!-- Impulsive rally candles -->
  <g stroke="#4ecb71" stroke-width="2">
    <line x1="280" y1="240" x2="280" y2="200"/>
    <rect x="270" y="205" width="20" height="30" fill="#4ecb71"/>
    <line x1="330" y1="205" x2="330" y2="150"/>
    <rect x="320" y="155" width="20" height="45" fill="#4ecb71"/>
    <line x1="380" y1="155" x2="380" y2="100"/>
    <rect x="370" y="105" width="20" height="45" fill="#4ecb71"/>
    <line x1="430" y1="100" x2="430" y2="70"/>
    <rect x="420" y="72" width="20" height="25" fill="#4ecb71"/>
  </g>

  <!-- Pullback returning to mitigate the OB -->
  <path d="M 450 90 C 550 150, 600 220, 650 245" stroke="#e8ecf1" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
  <g stroke="#4ecb71" stroke-width="2">
    <line x1="690" y1="235" x2="690" y2="195"/>
    <rect x="680" y="200" width="20" height="30" fill="#4ecb71"/>
  </g>
  <path d="M 660 250 L 700 240" stroke="#ffd166" stroke-width="2"/>
  <text x="620" y="300" fill="#8a93a6" font-size="13" text-anchor="middle">Price returns to mitigate</text>
  <text x="620" y="318" fill="#8a93a6" font-size="13" text-anchor="middle">the Order Block, then continues up</text>

  <text x="400" y="400" fill="#5b6478" font-size="12" text-anchor="middle">Original illustrative diagram — educational purposes only</text>
</svg>
