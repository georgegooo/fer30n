<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="380" fill="#0f1420"/>
  <text x="400" y="35" fill="#e8ecf1" font-size="20" font-weight="bold" text-anchor="middle">Risk / Reward (R-Multiple)</text>

  <!-- Entry line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#e8ecf1" stroke-width="2"/>
  <text x="710" y="205" fill="#e8ecf1" font-size="13">Entry</text>

  <!-- Stop loss zone (risk = 1R) -->
  <rect x="100" y="200" width="600" height="60" fill="#ff6b6b" opacity="0.15"/>
  <line x1="100" y1="260" x2="700" y2="260" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="710" y="264" fill="#ff6b6b" font-size="13">Stop (-1R)</text>

  <!-- Targets -->
  <line x1="100" y1="140" x2="700" y2="140" stroke="#4ecb71" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="710" y="144" fill="#4ecb71" font-size="12">+1R</text>
  <line x1="100" y1="80" x2="700" y2="80" stroke="#4ecb71" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="710" y="84" fill="#4ecb71" font-size="12">+2R</text>

  <!-- Risk bracket -->
  <line x1="140" y1="200" x2="140" y2="260" stroke="#ff6b6b" stroke-width="2"/>
  <text x="150" y="234" fill="#ff6b6b" font-size="13">Risk = 1R</text>

  <!-- Reward bracket -->
  <line x1="500" y1="80" x2="500" y2="200" stroke="#4ecb71" stroke-width="2"/>
  <text x="510" y="145" fill="#4ecb71" font-size="13">Reward = 2R</text>

  <!-- Price path -->
  <path d="M 100 200 C 200 210, 260 250, 300 240 S 380 150, 500 82" stroke="#ffd166" stroke-width="2.5" fill="none"/>

  <text x="400" y="320" fill="#8a93a6" font-size="13" text-anchor="middle">A 1:2 setup risks 1R to target 2R — the plan is fixed before entry,</text>
  <text x="400" y="338" fill="#8a93a6" font-size="13" text-anchor="middle">the actual outcome (win/loss) is never guaranteed</text>

  <text x="400" y="365" fill="#5b6478" font-size="12" text-anchor="middle">Original illustrative diagram — educational purposes only</text>
</svg>
