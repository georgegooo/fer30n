<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="800" height="420" fill="#0f1420"/>
  <text x="400" y="35" fill="#e8ecf1" font-size="20" font-weight="bold" text-anchor="middle">Elliott Wave — 5 Impulse + 3 Corrective (Basic Structure)</text>

  <!-- impulse waves 1-5 -->
  <path d="M 60 340
           L 130 260
           L 170 300
           L 260 160
           L 310 210
           L 420 90"
        stroke="#4ecb71" stroke-width="3" fill="none"/>

  <!-- corrective waves A-B-C -->
  <path d="M 420 90
           L 490 170
           L 560 130
           L 640 260"
        stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="7,4"/>

  <!-- wave labels -->
  <text x="55" y="358" fill="#8fa3c8" font-size="12">0</text>
  <text x="128" y="248" fill="#4ecb71" font-size="13" font-weight="bold">1</text>
  <text x="168" y="316" fill="#4ecb71" font-size="13" font-weight="bold">2</text>
  <text x="255" y="148" fill="#4ecb71" font-size="13" font-weight="bold">3</text>
  <text x="308" y="226" fill="#4ecb71" font-size="13" font-weight="bold">4</text>
  <text x="418" y="78" fill="#4ecb71" font-size="13" font-weight="bold">5</text>
  <text x="488" y="160" fill="#e07a5f" font-size="13" font-weight="bold">A</text>
  <text x="558" y="120" fill="#e07a5f" font-size="13" font-weight="bold">B</text>
  <text x="638" y="278" fill="#e07a5f" font-size="13" font-weight="bold">C</text>

  <!-- guideline annotations -->
  <line x1="130" y1="260" x2="800" y2="260" stroke="#8fa3c8" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="440" y="252" fill="#8fa3c8" font-size="11">قاعدة إرشادية: الموجة 2 لا تتجاوز عادة بداية الموجة 1</text>

  <rect x="40" y="380" width="18" height="14" fill="#4ecb71"/>
  <text x="65" y="392" fill="#e8ecf1" font-size="12">موجات دافعة (1-3-5 مع الاتجاه، 2-4 تصحيحية)</text>
  <rect x="430" y="380" width="18" height="14" fill="#e07a5f"/>
  <text x="455" y="392" fill="#e8ecf1" font-size="12">موجات تصحيحية (A-B-C عكس الاتجاه)</text>
</svg>
